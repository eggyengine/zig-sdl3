name: test
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
env:
  ZIG_VERSION: 0.16.0
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  docs:
    name: Build Documentation
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Documentation Linux
        run: zig build docs -Dtarget=x86_64-linux-gnu -Dext_image=true -Dext_net=true -Dext_ttf=true -Dext_shadercross=true
      - name: Build Documentation Windows
        run: zig build docs -Dtarget=x86_64-windows -Dext_image=true -Dext_net=true -Dext_ttf=true -Dext_shadercross=true
  examples:
    name: Build Examples
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Examples Linux
        run: zig build examples -Dtarget=x86_64-linux-gnu -Dext_image=true -Dext_net=true -Dext_ttf=true -Dext_shadercross=true
      - name: Build Examples Windows
        run: zig build examples -Dtarget=x86_64-windows -Dext_image=true -Dext_net=true -Dext_ttf=true -Dext_shadercross=true
  gpu_examples:
    name: Build GPU Examples
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Install SPIR-V Tools
        run: apt update && apt install spirv-tools -y
      - name: Build Examples Linux
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-linux-gnu
      - name: Build Examples Windows
        run: cd gpu_examples && zig build examples -Dtarget=x86_64-windows
  template:
    name: Build Template
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build Template Linux
        run: cd template && zig build -Dtarget=x86_64-linux-gnu
      - name: Build Template Windows
        run: cd template && zig build -Dtarget=x86_64-windows
  test:
    name: Testing
    runs-on: docker
    steps:
      - uses: actions/checkout@v3
      - uses: https://codeberg.org/mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Testing Linux
        run: zig build test -Dtarget=x86_64-linux-gnu -Dext_image=true -Dext_ttf=true -Dext_net=true -Dext_shadercross=true
      - name: Testing Windows
        run: zig build test -Dtarget=x86_64-linux-gnu -Dext_image=true -Dext_ttf=true -Dext_net=true -Dext_shadercross=true -fwine
